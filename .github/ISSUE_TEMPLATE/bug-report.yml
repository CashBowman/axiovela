name: Bug report
description: Report a reproducible problem with Axiovela.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, login state, private research data, or full assistant logs. Report security concerns privately using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal, sanitized example when possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/architecture and app version (Help → About Axiovela). For source installs, also include Node version and commit. Include provider/CLI version only if relevant. No credentials or personal paths.
    validations:
      required: true
