name: Validate retained installers

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Platform to validate (all includes both Mac architectures on Tahoe)
        type: choice
        default: all
        options: [all, ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15, macos-15-intel]
      build_run:
        description: Desktop release run containing the installer artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.runner && inputs.runner != 'all' && format('[{{"os":"{0}","artifact":"Axiovela-desktop-{0}"}}]', inputs.runner) || '[{"os":"ubuntu-latest","artifact":"Axiovela-desktop-ubuntu-latest"},{"os":"ubuntu-24.04-arm","artifact":"Axiovela-desktop-ubuntu-24.04-arm"},{"os":"windows-latest","artifact":"Axiovela-desktop-windows-latest"},{"os":"windows-11-arm","artifact":"Axiovela-desktop-windows-11-arm"},{"os":"macos-15","artifact":"Axiovela-desktop-macos-15"},{"os":"macos-15-intel","artifact":"Axiovela-desktop-macos-15-intel"},{"os":"macos-26","artifact":"Axiovela-desktop-macos-15"},{"os":"macos-26-intel","artifact":"Axiovela-desktop-macos-15-intel"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: ${{ matrix.artifact }}
          path: out/make
      - name: Verify original installer checksums
        run: node scripts/verify-desktop-checksums.mjs
      - name: Extract the saved Windows portable app
        if: runner.os == 'Windows'
        shell: bash
        run: node --input-type=module -e "import extract from 'extract-zip'; import path from 'node:path'; await extract(path.resolve('out/make/zip/win32/' + process.arch + '/Axiovela-win32-' + process.arch + '-0.2.2.zip'), {dir:path.resolve('out/Axiovela-win32-' + process.arch)});"
      - name: Test the saved Windows application
        if: runner.os == 'Windows'
        env:
          HYPOTERA_TEST_LATEX: '1'
        run: npm run desktop:smoke -- --packaged
      - name: Install the saved Linux DEB
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb ./out/make/deb/*/*.deb
      - name: Test the installed Linux app with its system sandbox helper
        if: runner.os == 'Linux'
        env:
          AXIOVELA_TEST_INSTALLED_ROOT: /usr/lib/axiovela
          HYPOTERA_TEST_LATEX: '1'
          DEBUG: pw:browser
        run: |
          xvfb-run -a npm run desktop:smoke -- --packaged
          xvfb-run -a npm run beta:feedback:smoke
          xvfb-run -a npm run desktop:recovery:smoke
      - name: Install the saved DMG and test launch, rendering, and recovery
        if: runner.os == 'macOS'
        env:
          HYPOTERA_TEST_LATEX: '1'
        run: node scripts/desktop-dmg-smoke.mjs
      - name: Test chat, project tabs, copying, setup boundaries, and PDF export
        if: runner.os != 'Linux'
        run: npm run beta:feedback:smoke
      - name: Test concurrent chats (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run parallel:smoke
      - name: Test concurrent chats (Mac/Windows)
        if: runner.os != 'Linux'
        run: npm run parallel:smoke
      - name: Test Windows recovery
        if: runner.os == 'Windows'
        run: npm run desktop:recovery:smoke
      - name: Retain isolated test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-diagnostics-${{ matrix.os }}
          path: .local/parallel-0.2.2/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: Mac-validation-${{ matrix.os }}
          path: out/make/MAC-TRUST-*.json
          if-no-files-found: warn
